<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Approve">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>RealHub Approve</title>
<!--
  RealHub Approve — the phone half of "approve on my phone" (migration 105).
  Rod, 2026-10-17: a notification on the phone, tap it, tap Approve.
  Lives on GitHub Pages until RealHub itself is online. It holds no RealHub
  sign-in: once paired, it has its own secret, kept on this phone only.
-->
<!-- The RealHub look: a copy of css/realhub-tokens.css (this folder is
     published on its own, so it carries its own; test/device-trust.test.mjs
     checks the copy matches). Dark mode follows the phone. -->
<link rel="stylesheet" href="./realhub-tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 14px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 30px; height: 30px; border-radius: var(--radius-sm); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  ol { padding-left: 20px; margin: 8px 0 0; } li { margin: 6px 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; font: inherit; font-size: 20px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); }
  input.code { letter-spacing: .14em; text-transform: uppercase; text-align: center; font-weight: 700; }
  button { width: 100%; font: inherit; font-size: 17px; font-weight: 700; padding: 14px; border-radius: var(--radius); border: 0; margin-top: 12px; cursor: pointer; }
  .go { background: var(--brand-1); color: #fff; } .ok { background: var(--ok); color: #fff; } .no { background: transparent; color: var(--err); border: 1px solid var(--border); }
  .link { background: none; color: var(--muted); font-size: 13px; font-weight: 400; padding: 6px; }
  .msg { font-size: 14px; margin-top: 10px; } .msg.err { color: var(--err); } .msg.good { color: var(--ok); }
  .req .what { font-size: 15px; margin: 4px 0 2px; } .req .row { display: flex; gap: 10px; } .req .row button { flex: 1; }
  .hl { border-color: var(--brand-1); box-shadow: 0 0 0 2px var(--brand-1) inset; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="./icon-192.png" alt="">RealHub Approve</h1>
  <div id="app"><div class="card muted">One moment…</div></div>
</div>
<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
